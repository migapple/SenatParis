<title>Présidents du Sénat</title>

<style>
:root {
  --gold:#C9993A; --gold-light:#E8C76A; --gold-pale:#F5E8C0;
  --ink:#050D1A; --parchment:#E8F0FA;
  --r3:#8B5A10; --ve:#4B1A7A;
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Cormorant Garamond',Georgia,serif;background:var(--ink);color:var(--parchment);min-height:100vh;overflow-x:hidden;}

/* ── HEADER ── */
header{
  position:sticky;top:0;z-index:100;
  background:linear-gradient(180deg,#020810 0%,#050D1A 100%);
  border-bottom:1px solid rgba(201,153,58,0.3);
  padding:calc(var(--safe-top) + 10px) 16px 12px;
}
.header-top{display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:6px;}
header h1{
  font-family:'IM Fell English',serif;font-size:22px;letter-spacing:0.04em;
  background:linear-gradient(135deg,var(--gold-light) 0%,var(--gold) 40%,var(--gold-pale) 70%,var(--gold) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;text-align:center;
}
.settings-btn{
  position:absolute;right:0;top:50%;transform:translateY(-50%);
  background:none;border:none;font-size:20px;cursor:pointer;padding:6px;
  color:rgba(201,153,58,0.7);
}
.subtitle{text-align:center;font-size:11px;letter-spacing:0.25em;text-transform:uppercase;color:rgba(201,153,58,0.45);margin-bottom:10px;font-style:italic;}

/* ── SEARCH ── */
.search-wrap{position:relative;margin-bottom:8px;}
.search-wrap input{
  width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(201,153,58,0.25);border-radius:8px;
  padding:8px 32px 8px 34px;color:var(--parchment);font-family:'Cormorant Garamond',serif;font-size:15px;outline:none;transition:border-color .2s;
}
.search-wrap input::placeholder{color:rgba(232,240,250,0.3);}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;opacity:0.4;}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(232,240,250,0.5);font-size:18px;cursor:pointer;display:none;padding:4px;}

/* ── FILTERS ── */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.filter-btn{
  flex-shrink:0;padding:5px 12px;border-radius:20px;border:1px solid rgba(201,153,58,0.25);
  background:rgba(255,255,255,0.03);color:rgba(232,240,250,0.65);font-family:'Cormorant Garamond',serif;
  font-size:13px;cursor:pointer;transition:all .2s;white-space:nowrap;
}
.filter-btn.active{color:#fff;border-color:transparent;}

/* ── CONTENT ── */
.content{padding:0 16px;}
.counter{font-size:12px;color:rgba(201,153,58,0.5);text-align:right;padding:8px 0 4px;font-style:italic;}

/* ── CARDS ── */
.cards{padding:0 0 calc(var(--safe-bot) + 20px);}
.card{
  display:flex;gap:12px;padding:12px;margin-bottom:8px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(201,153,58,0.12);border-radius:10px;
  cursor:pointer;transition:background .15s;
}
.card:active{background:rgba(201,153,58,0.08);}
.card-img{
  width:58px;height:70px;border-radius:6px;flex-shrink:0;
  background:rgba(201,153,58,0.08);object-fit:cover;object-position:top center;
}
.card-img.loading{animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:0.7}}
.card-body{flex:1;min-width:0;}
.card-name{font-family:'IM Fell English',serif;font-size:15px;color:var(--gold-light);margin-bottom:2px;line-height:1.2;}
.card-dates{font-size:12px;color:rgba(232,240,250,0.55);margin-bottom:4px;}
.card-party{font-size:11.5px;color:rgba(232,240,250,0.4);font-style:italic;}
.card-badges{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;}
.badge-rep{font-size:10px;padding:2px 7px;border-radius:10px;font-style:italic;color:#fff;opacity:0.85;}
.badge-actuel{font-size:10px;padding:2px 7px;border-radius:10px;background:#1A6B30;color:#7FD49B;}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;z-index:200;background:rgba(5,13,26,0.85);
  display:none;align-items:flex-end;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.modal-overlay.open{display:flex;}
.modal-sheet{
  width:100%;max-height:88vh;overflow-y:auto;
  background:#080F1E;border-top:1px solid rgba(201,153,58,0.3);
  border-radius:16px 16px 0 0;padding:0 0 calc(var(--safe-bot) + 20px);
  animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:rgba(201,153,58,0.3);border-radius:2px;margin:12px auto 0;cursor:pointer;padding:8px 40px;}
.modal-header{padding:12px 20px 0;}
.modal-portrait{
  width:90px;height:110px;border-radius:8px;float:right;margin:0 0 12px 14px;
  object-fit:cover;object-position:top;background:rgba(201,153,58,0.08);
}
.modal-portrait.loading{animation:pulse 1.5s ease-in-out infinite;}
.modal-name{font-family:'IM Fell English',serif;font-size:20px;color:var(--gold-light);line-height:1.2;margin-bottom:4px;}
.modal-sub{font-size:13px;color:rgba(232,240,250,0.55);margin-bottom:10px;}
.modal-body{padding:0 20px;clear:both;}
.modal-section{margin-bottom:12px;}
.modal-label{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(201,153,58,0.5);margin-bottom:3px;}
.modal-text{font-size:14.5px;color:rgba(232,240,250,0.8);line-height:1.55;}
.modal-events{font-size:13px;color:rgba(201,153,58,0.75);line-height:1.8;}
.modal-close{
  display:block;width:calc(100% - 40px);margin:16px 20px 0;padding:12px;
  background:rgba(201,153,58,0.12);border:1px solid rgba(201,153,58,0.25);border-radius:10px;
  color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:15px;cursor:pointer;letter-spacing:0.05em;
}

/* ── SETTINGS ── */
.settings-overlay{
  position:fixed;inset:0;z-index:300;background:rgba(5,13,26,0.85);
  display:none;align-items:flex-end;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.settings-overlay.open{display:flex;}
.settings-sheet{
  width:100%;max-height:92vh;overflow-y:auto;
  background:#080F1E;border-top:1px solid rgba(201,153,58,0.3);
  border-radius:16px 16px 0 0;padding-bottom:calc(var(--safe-bot) + 20px);
  animation:slideUp .25s ease;
}
.settings-handle{width:40px;height:4px;background:rgba(201,153,58,0.28);border-radius:2px;margin:12px auto 20px;cursor:pointer;}
.settings-title{font-family:'IM Fell English',serif;font-size:18px;color:var(--gold);text-align:center;padding:0 20px 16px;border-bottom:1px solid rgba(201,153,58,0.15);}
.settings-section{padding:16px 20px 0;}
.settings-section-title{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(201,153,58,0.5);margin-bottom:10px;}
.app-row{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;}
.app-row-icon{width:36px;height:36px;border-radius:8px;background:rgba(201,153,58,0.1);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.app-row-info{flex:1;}
.app-row-name{font-size:14px;color:var(--parchment);}
.app-row-desc{font-size:12px;color:rgba(232,240,250,0.4);font-style:italic;}
.app-row-arrow{color:rgba(201,153,58,0.4);font-size:16px;}
.settings-divider{height:1px;background:rgba(201,153,58,0.08);margin-left:48px;}
.settings-copyright{text-align:center;padding:24px 20px 0;font-size:12px;color:rgba(232,240,250,0.3);line-height:1.7;}
.settings-claude-badge{margin-top:12px;font-size:11px;color:rgba(201,153,58,0.3);letter-spacing:0.1em;}
.settings-close{
  display:block;width:calc(100% - 40px);margin:16px 20px 0;padding:12px;
  background:rgba(201,153,58,0.1);border:1px solid rgba(201,153,58,0.2);border-radius:10px;
  color:rgba(201,153,58,0.7);font-family:'Cormorant Garamond',serif;font-size:15px;cursor:pointer;
}
</style>
</head>
<body>

<header>
  <div class="header-top">

</div>

    parti:"Les Républicains",
    wikiTitle:"Gérard_Larcher",
    bio:"De retour au perchoir en octobre 2014, Gérard Larcher est désormais le président du Sénat en poste depuis le plus longtemps sous la Ve République. Voix forte de la droite sénatoriale face aux exécutifs successifs — Hollande, Macron, Borne, Attal, Bayrou — il est régulièrement évoqué comme figure présidentiable de la droite républicaine. Sa longévité et son autorité font de lui un acteur incontournable de la vie institutionnelle française.",
    events:"2e mandat depuis oct. 2014 · Plus long titulaire sous la Ve à ce jour · 2e personnage de l'État · Interlocuteur majeur de tous les exécutifs depuis 2014"
  }
];

// ══════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════
const MGA_CONFIG = {
  appCourante: "senat",
  apps: [
    {id:"id6478837462", icon:"🍷", nom:"Cave Manager",          desc:"Gérez votre cave à vin"},
    {id:"id6476972965", icon:"💊", nom:"MediManager",           desc:"Suivi de vos médicaments"},
    {id:"id6504267617", icon:"🍽", nom:"MesRestaurants",        desc:"Vos restaurants favoris"},
    {id:"id6738601726", icon:"🕊", nom:"Cimetières Paris",      desc:"Personnages célèbres"},
    {id:"id6743158361", icon:"🏛", nom:"Musées de Paris",       desc:"37 musées parisiens"},
    {id:"roisdefrance",  icon:"⚜️", nom:"Rois de France",        desc:"44 rois de Clovis à Louis-Philippe"},
    {id:"presidentsrep", icon:"🎖", nom:"Présidents République", desc:"De 1848 à nos jours"},
    {id:"assemblee",     icon:"🏛", nom:"Assemblée nationale",   desc:"Présidents depuis 1876"}
  ]
};

const FILTER_COLORS = {
  "IIIe Rép.": "#8B5A10",
  "Ve Rép.":   "#4B1A7A"
};

const IMG_PREFIX = "senat_img_";
const IMG_TTL    = 7 * 24 * 60 * 60 * 1000;

let activeFilter = "Tout";
let searchQuery  = "";

// ── Portrait Wikipedia ────────────────────────
function getPortrait(wikiTitle, imgEl) {
  const key = IMG_PREFIX + wikiTitle;
  try {
    const cached = localStorage.getItem(key);
    if (cached) {
      const {url, ts} = JSON.parse(cached);
      if (Date.now() - ts < IMG_TTL) {
        imgEl.src = url; imgEl.classList.remove("loading"); return;
      }
    }
  } catch(e) {}
  const cb = "cb_" + Date.now() + "_" + Math.random().toString(36).slice(2);
  const script = document.createElement("script");
  script.src = `https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(wikiTitle)}?callback=${cb}`;
  window[cb] = (data) => {
    const url = data?.thumbnail?.source || data?.originalimage?.source;
    if (url) {
      imgEl.src = url; imgEl.classList.remove("loading");
      try { localStorage.setItem(key, JSON.stringify({url, ts:Date.now()})); } catch(e) {}
    }
    delete window[cb]; script.remove();
  };
  document.head.appendChild(script);
}

// ── Normalise accent ─────────────────────────
function norm(s) {
  return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
}

// ── Filtres ──────────────────────────────────
function buildFilters() {
  const reps = ["Tout", ...Object.keys(FILTER_COLORS)];
  const el = document.getElementById("filtersContainer");
  el.innerHTML = "";
  reps.forEach(r => {
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (r === activeFilter ? " active" : "");
    btn.textContent = r;
    if (r === "Tout") {
      if (r === activeFilter) btn.style.background = "rgba(201,153,58,0.35)";
    } else {
      const col = FILTER_COLORS[r];
      if (r === activeFilter) btn.style.background = col;
      else btn.style.borderColor = col + "55";
    }
    btn.onclick = () => { activeFilter = r; buildFilters(); renderList(); };
    el.appendChild(btn);
  });
}

// ── Rendu liste ──────────────────────────────
function renderList() {
  const q = norm(searchQuery);
  const list = DATA.filter(p => {
    if (activeFilter !== "Tout" && p.rep !== activeFilter) return false;
    if (q && !norm(p.name).includes(q) && !norm(p.parti).includes(q)) return false;
    return true;
  });
  const el    = document.getElementById("cardsList");
  const count = document.getElementById("counter");
  count.textContent = list.length + " président" + (list.length > 1 ? "s" : "");
  el.innerHTML = "";
  list.forEach(p => {
    const col      = FILTER_COLORS[p.rep] || "#555";
    const finLabel = p.actuel ? "en poste" : (p.fin || "");
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img class="card-img loading" id="ci_${p.id}" src="" alt="${p.name}">
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-dates">${p.debut} – ${finLabel}</div>
        <div class="card-party">${p.parti}</div>
        <div class="card-badges">
          <span class="badge-rep" style="background:${col}">${p.rep}</span>
          ${p.actuel ? '<span class="badge-actuel">En poste</span>' : ""}
        </div>
      </div>`;
    card.onclick = () => openModal(p);
    el.appendChild(card);
    getPortrait(p.wikiTitle, document.getElementById("ci_" + p.id));
  });
}

// ── Modal ────────────────────────────────────
function openModal(p) {
  const col      = FILTER_COLORS[p.rep] || "#555";
  const finLabel = p.actuel ? "en poste" : (p.fin || "");
  const years    = p.actuel ? (2026 - p.debut) : (p.fin - p.debut);
  document.getElementById("modalName").textContent  = p.name;
  document.getElementById("modalSub").innerHTML     = `<span style="color:${col}">${p.rep}</span>${p.actuel ? ' · <span style="color:#7FD49B">En poste</span>' : ""}`;
  document.getElementById("modalMandat").textContent = `${p.debut} – ${finLabel} (${years} an${years>1?"s":""})`;
  document.getElementById("modalParti").textContent  = p.parti;
  document.getElementById("modalBio").textContent    = p.bio;
  document.getElementById("modalEvents").innerHTML   = p.events.split(" · ").map(e=>"• "+e).join("<br>");
  const portrait = document.getElementById("modalPortrait");
  portrait.src = ""; portrait.classList.add("loading");
  getPortrait(p.wikiTitle, portrait);
  document.getElementById("modalOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal() {
  document.getElementById("modalOverlay").classList.remove("open");
  document.body.style.overflow = "";
}

// ── Settings ─────────────────────────────────
function buildSettings() {
  const el   = document.getElementById("settingsContent");
  const apps = MGA_CONFIG.apps.filter(a => a.id !== MGA_CONFIG.appCourante);
  el.innerHTML = `<div class="settings-section"><div class="settings-section-title">Nos autres applications</div>`;
  apps.forEach((app, i) => {
    el.innerHTML += `
      <div class="app-row" onclick="openAppStore('${app.id}')">
        <div class="app-row-icon">${app.icon}</div>
        <div class="app-row-info">
          <div class="app-row-name">${app.nom}</div>
          <div class="app-row-desc">${app.desc}</div>
        </div>
        <div class="app-row-arrow">›</div>
      </div>${i < apps.length-1 ? '<div class="settings-divider"></div>' : ""}`;
  });
  el.innerHTML += `</div>`;
}
function openAppStore(appId) {
  window.open("https://apps.apple.com/fr/app/" + appId, "_blank");
}
function closeSettings() {
  document.getElementById("settingsOverlay").classList.remove("open");
  document.body.style.overflow = "";
}

// ── Events ───────────────────────────────────
document.getElementById("searchInput").addEventListener("input", function() {
  searchQuery = this.value;
  document.getElementById("searchClear").style.display = searchQuery ? "block" : "none";
  renderList();
});
document.getElementById("searchClear").onclick = () => {
  document.getElementById("searchInput").value = "";
  searchQuery = "";
  document.getElementById("searchClear").style.display = "none";
  renderList();
};
document.getElementById("modalOverlay").addEventListener("click", e => {
  if (e.target === document.getElementById("modalOverlay")) closeModal();
});
document.getElementById("modalHandle").onclick = closeModal;
document.getElementById("modalClose").onclick   = closeModal;
document.getElementById("settingsOverlay").addEventListener("click", e => {
  if (e.target === document.getElementById("settingsOverlay")) closeSettings();
});
document.getElementById("settingsBtn").onclick = () => {
  document.getElementById("settingsOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
};

// ── Init ─────────────────────────────────────
buildFilters();
buildSettings();
renderList();
</script>
</body>
</html>
